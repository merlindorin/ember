# Builds the guide on every push to main, as the homelab serves it at
# https://ember.vanyda.cloud/ember/: every example built for the browser
# (task web:guide, at live/ for the "Run in your browser" buttons), the
# guide's pictures captured headless on lavapipe (task docs:shots, kept
# between runs so only the shots whose code changed are remade), then the
# Hugo site (task docs:build). The site goes into an nginx image, checked
# running (deploy/docs/check.sh), then pushed to ghcr.io as sha-<commit> and
# latest, for linux/amd64 and linux/arm64. The chart that deploys it is
# published by chart.yml.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docs
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ember-docs

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux libraries (GLFW's X11 and Wayland headers, ALSA, Vulkan with lavapipe, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libvulkan-dev mesa-vulkan-drivers xvfb

      - name: wgpu-native
        run: task wgpu

      - name: The pictures made last time, by their keys
        uses: actions/cache@v4
        with:
          path: |
            dist/shots/keys
            docs/**/*.png
            docs/**/*.gif
          key: shots-${{ hashFiles('internal/shots/**', 'go.sum') }}-${{ github.sha }}
          restore-keys: shots-${{ hashFiles('internal/shots/**', 'go.sum') }}-

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: The guide, its pictures and its live examples
        env:
          EMBER_WGPU_FALLBACK: "1"
        run: xvfb-run -a task docs:build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: The image, checked running
        run: task docs:image:check IMAGE=ember-docs:check

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push sha-${{ github.sha }} and latest
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" -t "$IMAGE:latest" \
            -f deploy/docs/Dockerfile .
