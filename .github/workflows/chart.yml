# Lints and renders the ember-docs chart on every change to it, and on main
# publishes it to oci://ghcr.io/<owner>/charts for ArgoCD.
name: Chart

on:
  push:
    branches: [main]
    paths: ["helm/**", ".github/workflows/chart.yml"]
  pull_request:
    paths: ["helm/**", ".github/workflows/chart.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: helm lint and template
        run: task chart:check

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package helm/ember-docs -d "$RUNNER_TEMP/pkg"
          helm push "$RUNNER_TEMP"/pkg/ember-docs-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
