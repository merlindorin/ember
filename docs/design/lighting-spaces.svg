<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 L0,20" fill="none" stroke="#ccc" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="980" height="420" fill="#fbfaf6"/>

  <!-- 1 world -->
  <text x="20" y="28" font-weight="bold" font-size="15" fill="#222">① World (points)</text>
  <rect x="20" y="44" width="220" height="200" fill="url(#g)" stroke="#999"/>
  <rect x="60" y="84" width="140" height="100" fill="#dfe9f6" stroke="#3b6ea8" stroke-width="2"/>
  <circle cx="60" cy="84" r="4" fill="#3b6ea8"/>
  <text x="66" y="78" font-size="12" fill="#1f3f66">O = (i₀·C, j₀·C)</text>
  <text x="96" y="200" font-size="12" fill="#1f3f66">w × h cells</text>
  <circle cx="150" cy="130" r="4" fill="#d98a1c"/>
  <text x="158" y="134" font-size="12" fill="#7a4a08">p</text>
  <text x="20" y="266" font-size="12" fill="#444">a cell is C = 32 points</text>
  <text x="20" y="284" font-size="12" fill="#444">a mask is placed at its area's</text>
  <text x="20" y="300" font-size="12" fill="#444">top-left cell O</text>

  <line x1="246" y1="140" x2="272" y2="140" stroke="#333" marker-end="url(#a)"/>

  <!-- 2 mask -->
  <text x="280" y="28" font-weight="bold" font-size="15" fill="#222">② Mask (texels)</text>
  <rect x="280" y="64" width="140" height="100" fill="#fff" stroke="#3b6ea8" stroke-width="2"/>
  <g fill="#3b6ea8"><circle cx="290" cy="74" r="2.5"/><circle cx="310" cy="74" r="2.5"/><circle cx="330" cy="74" r="2.5"/><circle cx="350" cy="74" r="2.5"/><circle cx="370" cy="74" r="2.5"/><circle cx="390" cy="74" r="2.5"/><circle cx="410" cy="74" r="2.5"/><circle cx="290" cy="94" r="2.5"/><circle cx="310" cy="94" r="2.5"/><circle cx="330" cy="94" r="2.5"/><circle cx="350" cy="94" r="2.5"/><circle cx="370" cy="94" r="2.5"/><circle cx="390" cy="94" r="2.5"/><circle cx="410" cy="94" r="2.5"/><circle cx="290" cy="114" r="2.5"/><circle cx="310" cy="114" r="2.5"/><circle cx="330" cy="114" r="2.5"/><circle cx="350" cy="114" r="2.5"/><circle cx="370" cy="114" r="2.5"/><circle cx="390" cy="114" r="2.5"/><circle cx="410" cy="114" r="2.5"/><circle cx="290" cy="134" r="2.5"/><circle cx="310" cy="134" r="2.5"/><circle cx="330" cy="134" r="2.5"/><circle cx="350" cy="134" r="2.5"/><circle cx="370" cy="134" r="2.5"/><circle cx="390" cy="134" r="2.5"/><circle cx="410" cy="134" r="2.5"/><circle cx="290" cy="154" r="2.5"/><circle cx="310" cy="154" r="2.5"/><circle cx="330" cy="154" r="2.5"/><circle cx="350" cy="154" r="2.5"/><circle cx="370" cy="154" r="2.5"/><circle cx="390" cy="154" r="2.5"/><circle cx="410" cy="154" r="2.5"/></g>
  <text x="280" y="186" font-size="12" fill="#1f3f66">texel k's centre = cell k's centre</text>
  <text x="280" y="204" font-size="12" fill="#1f3f66">w × h texels, R8, 0 or 255</text>
  <text x="280" y="232" font-family="Menlo, monospace" font-size="12" fill="#222">uv = (p − O)</text><text x="306" y="248" font-family="Menlo, monospace" font-size="12" fill="#222">/ (C·w, C·h)</text>
  <text x="280" y="274" font-size="12" fill="#444">bilinear: 0 → 1 between</text>
  <text x="280" y="290" font-size="12" fill="#444">neighbouring cell centres</text>

  <line x1="426" y1="140" x2="452" y2="140" stroke="#333" marker-end="url(#a)"/>

  <!-- 3 atlas -->
  <text x="460" y="28" font-weight="bold" font-size="15" fill="#222">③ Mask atlas page</text>
  <rect x="460" y="44" width="200" height="200" fill="#fff" stroke="#999"/>
  <rect x="470" y="54" width="70" height="50" fill="#e8e8e8" stroke="#bbb"/>
  <rect x="546" y="54" width="104" height="80" fill="#dfe9f6" stroke="#3b6ea8" stroke-width="2"/>
  <rect x="550" y="58" width="96" height="72" fill="none" stroke="#3b6ea8" stroke-dasharray="3 2"/>
  <rect x="470" y="110" width="70" height="90" fill="#e8e8e8" stroke="#bbb"/>
  <rect x="546" y="140" width="60" height="60" fill="#e8e8e8" stroke="#bbb"/>
  <text x="560" y="98" font-size="11" fill="#1f3f66">this mask</text>
  <text x="460" y="266" font-size="12" fill="#444">shelf-packed, a 1-texel border of 0</text>
  <text x="460" y="282" font-size="12" fill="#444">round each mask (no bleeding)</text>
  <text x="460" y="314" font-family="Menlo, monospace" font-size="12" fill="#222">uvₐ = rect.min + uv·rect.size</text>

  <line x1="666" y1="140" x2="692" y2="140" stroke="#333" marker-end="url(#a)"/>

  <!-- 4 light picture -->
  <text x="700" y="28" font-weight="bold" font-size="15" fill="#222">④ Light picture L</text>
  <rect x="700" y="44" width="260" height="160" fill="#2b2620" stroke="#555"/>
  <rect x="726" y="66" width="208" height="116" fill="none" stroke="#fff" stroke-dasharray="5 3"/>
  <text x="732" y="62" font-size="11" fill="#ddd">the view</text>
  <circle cx="820" cy="120" r="44" fill="#d98a1c" fill-opacity="0.55"/>
  <circle cx="820" cy="120" r="20" fill="#ffd28a" fill-opacity="0.8"/>
  <text x="706" y="198" font-size="11" fill="#ddd">margin m for LitAt anchors</text>
  <text x="700" y="226" font-size="12" fill="#444">the camera's view + m, at ½ resolution</text>
  <text x="700" y="246" font-family="Menlo, monospace" font-size="12" fill="#222">q  = cam.WorldToScreen(p)</text>
  <text x="700" y="264" font-family="Menlo, monospace" font-size="12" fill="#222">uvL = (q − L.min) / L.size</text>
  <text x="700" y="290" font-size="12" fill="#444">a light is a quad of 2·radius in world,</text>
  <text x="700" y="306" font-size="12" fill="#444">projected by the same camera; its</text>
  <text x="700" y="322" font-size="12" fill="#444">fragment knows p and reads uvₐ</text>

  <!-- bottom line -->
  <text x="20" y="372" font-size="13" fill="#222">One world point p gives every coordinate on the CPU (per light vertex) or in the shader:</text>
  <text x="20" y="394" font-family="Menlo, monospace" font-size="12" fill="#222">p → uv (mask) → uvₐ (atlas) for the light's clip   ·   p → q → uvL (light picture) for the sprite that reads it</text>
</svg>
