image:
  repository: ghcr.io/merlindorin/ember-docs
  tag: "" # defaults to .Chart.AppVersion; pin a sha-<commit> tag for repeatable deploys
  pullPolicy: Always
  pullSecrets: [] # the package is private while the repository is

replicas: 1
port: 8080
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ember.vanyda.cloud
  tls: [] # https is required: browsers start WebGPU, so the live examples, only in a secure context
