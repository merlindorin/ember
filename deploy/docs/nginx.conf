# The guide, built by task docs:build into public with baseURL /ember/, served
# under /ember/. Its live examples fetch NN-name.wasm.gz and unpack it in the
# page, so the .gz files go out as they are, without a Content-Encoding.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /ember/;
    }

    location /ember/live/ {
        add_header Cache-Control "no-cache" always;
        types {
            application/javascript js;
            text/html html;
            application/gzip gz;
        }
    }

    location /ember/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /ember/404.html;
}
