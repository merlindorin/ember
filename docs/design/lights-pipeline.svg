<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#fbfaf6"/>
  <text x="20" y="28" font-weight="bold" font-size="15" fill="#222">Each frame, per camera with lit layers: four GPU passes, no CPU ray casts</text>

  <!-- CPU -->
  <rect x="20" y="50" width="200" height="110" rx="6" fill="#fff" stroke="#888"/>
  <text x="32" y="72" font-weight="bold" fill="#222">CPU</text>
  <text x="32" y="94" fill="#444">lights in view → instances</text>
  <text x="32" y="114" fill="#444">occluders in view + reach</text>
  <text x="32" y="134" fill="#444">(collide shapes, sprites</text>
  <text x="32" y="150" fill="#444">marked Occluder)</text>

  <!-- pass 1 occluders -->
  <rect x="260" y="50" width="200" height="110" rx="6" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="272" y="72" font-weight="bold" fill="#222">① Occluder picture O</text>
  <text x="272" y="94" fill="#444">view + max radius</text>
  <text x="272" y="114" fill="#444">R8, ~4 texels per cell</text>
  <text x="272" y="134" fill="#444">bit per occluder group</text>
  <!-- tiny occluder sketch -->
  <rect x="400" y="80" width="40" height="60" fill="#fff" stroke="#999"/>
  <rect x="408" y="88" width="8" height="44" fill="#333"/>
  <rect x="424" y="112" width="10" height="10" fill="#333"/>
  <line x1="220" y1="105" x2="258" y2="105" stroke="#333" marker-end="url(#a)"/>

  <!-- pass 2 shadow maps -->
  <rect x="500" y="50" width="220" height="110" rx="6" fill="#eef3fa" stroke="#3b6ea8" stroke-width="1.5"/>
  <text x="512" y="72" font-weight="bold" fill="#1f3f66">② Shadow maps S (compute)</text>
  <text x="512" y="94" fill="#1f3f66">one row per light,</text>
  <text x="512" y="112" fill="#1f3f66">one column per angle (512):</text>
  <text x="512" y="130" fill="#1f3f66">march O from the light, store</text>
  <text x="512" y="148" fill="#1f3f66">distance to first occluder</text>
  <line x1="460" y1="105" x2="498" y2="105" stroke="#333" marker-end="url(#a)"/>

  <!-- pass 3 light picture -->
  <rect x="760" y="50" width="200" height="130" rx="6" fill="#fff8ec" stroke="#d98a1c" stroke-width="1.5"/>
  <text x="772" y="72" font-weight="bold" fill="#7a4a08">③ Light picture L</text>
  <text x="772" y="94" fill="#7a4a08">½ res, RGBA16Float</text>
  <text x="772" y="114" fill="#7a4a08">clear to ambient; each light:</text>
  <text x="772" y="132" fill="#7a4a08">falloff × visible(S, angle,</text>
  <text x="772" y="150" fill="#7a4a08">distance, softness), added</text>
  <text x="772" y="168" fill="#7a4a08">Shadows(false) lights skip S</text>
  <line x1="720" y1="105" x2="758" y2="105" stroke="#333" marker-end="url(#a)"/>

  <!-- pass 4 world -->
  <rect x="760" y="230" width="200" height="110" rx="6" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="772" y="252" font-weight="bold" fill="#222">④ Lit layers (forward)</text>
  <text x="772" y="274" fill="#444">colour × L(screen pos)</text>
  <text x="772" y="294" fill="#444">LitAt: × L(anchor)</text>
  <text x="772" y="314" fill="#444">Unlit: as drawn</text>
  <text x="772" y="332" fill="#444">y-sort unchanged</text>
  <line x1="860" y1="180" x2="860" y2="228" stroke="#333" marker-end="url(#a)"/>

  <!-- polar diagram -->
  <text x="20" y="214" font-weight="bold" fill="#222">How a shadow map row works</text>
  <rect x="20" y="226" width="300" height="180" fill="#2a2522"/>
  <defs><radialGradient id="lg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffcf7a" stop-opacity="0.9"/><stop offset="0.35" stop-color="#ffcf7a" stop-opacity="0.8"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient><clipPath id="pc"><rect x="20" y="226" width="300" height="180"/></clipPath></defs>
  <circle cx="170" cy="316" r="150" fill="url(#lg)" clip-path="url(#pc)"/>
  <polygon points="226,284 320,230 320,226 300,226 248,262" fill="#2a2522"/>
  <rect x="226" y="262" width="22" height="22" fill="#888"/>
  <circle cx="170" cy="316" r="5" fill="#fff"/>
  <line x1="170" y1="316" x2="226" y2="273" stroke="#3b6ea8" stroke-width="2"/>
  <text x="180" y="284" font-size="11" fill="#cfe0f5">d(θ)</text>
  <text x="30" y="246" font-size="11" fill="#ddd">angle θ → column; distance to the first</text>
  <text x="30" y="260" font-size="11" fill="#ddd">occluder texel → value</text>
  <text x="30" y="398" font-size="11" fill="#ddd">a pixel at (θ, r) is lit when r ≤ d(θ)</text>

  <!-- S texture sketch -->
  <text x="360" y="214" font-weight="bold" fill="#222">S: lights × angles</text>
  <rect x="360" y="226" width="300" height="120" fill="#fff" stroke="#3b6ea8"/>
  <g fill="#9cb8dc">
    <rect x="360" y="226" width="300" height="20"/>
    <rect x="360" y="266" width="300" height="20"/>
    <rect x="360" y="306" width="300" height="20"/>
  </g>
  <text x="366" y="240" font-size="11" fill="#1f3f66">light 0: d(θ₀) … d(θ₅₁₁)</text>
  <text x="366" y="260" font-size="11" fill="#1f3f66">light 1</text>
  <text x="366" y="280" font-size="11" fill="#1f3f66">light 2 …</text>
  <text x="360" y="366" font-size="12" fill="#444">R16Float; 256 lights × 512 angles = 256 KB</text>
  <text x="360" y="384" font-size="12" fill="#444">each texel: ≤ radius / texel steps through O</text>
  <text x="360" y="402" font-size="12" fill="#444">soft edge: compare with neighbouring angles (PCF)</text>
</svg>
